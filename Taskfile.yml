version: "3"

vars:
  SHELL_FILES: cx tests/test.sh tests/bench.sh
  INSTALL_DIR: "{{.HOME}}/.local/bin"
  # Pinned so a Biome release cannot change the lint result. Bump with biome.json's $schema.
  BIOME: bunx @biomejs/biome@2.6.3
  # Markdown only: biome owns cx.js and biome.json. Config in .prettierrc.json.
  PRETTIER: bunx prettier@3.9.10

tasks:
  setup:
    desc: Install the Homebrew toolchain
    cmds:
      - brew bundle

  check:
    desc: Lint, then test
    cmds:
      - task: lint
      - task: test

  install:
    desc: Symlink cx to ~/.local/bin
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      - ln -sf "$(pwd)/cx" {{.INSTALL_DIR}}/cx
    status:
      - test -L {{.INSTALL_DIR}}/cx

  uninstall:
    desc: Remove cx symlink
    cmds:
      - rm -f {{.INSTALL_DIR}}/cx

  test:
    desc: Run selftest and integration tests
    cmds:
      # Pure-function checks first: they need no permission and no contacts,
      # so a logic regression fails in milliseconds rather than minutes.
      - ./cx selftest
      - bash tests/test.sh

  bench:
    desc: Benchmark cx commands
    cmds:
      - bash tests/bench.sh

  lint:
    desc: Lint shell scripts, JavaScript and Markdown
    cmds:
      - shellcheck {{.SHELL_FILES}}
      - shfmt -d {{.SHELL_FILES}}
      - "{{.BIOME}} check cx.js"
      - "{{.PRETTIER}} --check '**/*.md'"

  fmt:
    desc: Format shell scripts, JavaScript and Markdown
    cmds:
      - shfmt -w {{.SHELL_FILES}}
      - "{{.BIOME}} check --fix cx.js"
      - "{{.PRETTIER}} --write --log-level warn '**/*.md'"
